name: Build Dylib
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone https://github.com/theos/sdks.git $THEOS/sdks
          
      - name: Install ldid
        run: brew install ldid
        
      - name: Build and Package
        run: |
          export THEOS=$HOME/theos
          make clean && make package
          
      - name: Find, Sign and Upload Dylib
        run: |
          # Tìm file dylib trong thư mục build của Theos
          DYLIB_PATH=$(find .theos -name "SpyDylib.dylib" -type f | head -n 1)
          echo "Found dylib at: $DYLIB_PATH"
          
          if [ -z "$DYLIB_PATH" ]; then echo "Build failed to produce dylib"; exit 1; fi
          
          # Sign file dylib chuẩn SHA256
          ldid -S "$DYLIB_PATH"
          
          # Copy ra ngoài cho dễ tải
          cp "$DYLIB_PATH" ./SpyDylib.dylib
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SpyDylib
          path: SpyDylib.dylib
